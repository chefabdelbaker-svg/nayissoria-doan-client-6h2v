 h+='<div class="grid g3"><div class="card kpi"><div class="n">'+avg(dl)+'%</div><div class="l">PROJECT PROGRESS · WORK STARTED 17 NOV<br><span style="text-transform:none">'+done+' of '+dl.length+' deliverables validated</span></div><div class="bar" style="margin-top:8px"><i style="width:'+avg(dl)+'%"></i></div></div><div class="card kpi"><div class="n">'+(nextDl?fd(nextDl.due):'—')+'</div><div class="l">NEXT DELIVERABLE'+(nextDl?'<br><span style="text-transform:none">'+esc(nextDl.title_en)+'</span>':'')+'</div></div><div class="card kpi"><div class="n">'+fmt(paid)+'</div><div class="l">SAR RECEIVED OF '+fmt(tot)+'</div><div class="bar" style="margin-top:8px"><i style="width:'+pct(paid,tot)+'%"></i></div></div></div>';
 const U=IT('upd').sort((a,b)=>(b.date||'')>(a.date||'')?1:-1);
 h+='<h2>Latest updates</h2>'+(U.length?U.map(u=>'<div class="card"><div class="small mut">'+esc(fd(u.date))+(isA()?' · <a href="#" data-del="'+u.id+'">delete</a>':'')+'</div>'+esc(u.text)+'</div>').join(''):'<p class="mut">No update yet.</p>');
 if(isA())h+='<div class="card"><div class="row"><input type="text" id="newUpd" placeholder="Write an update for the client…" style="flex:1"><button class="g" data-act="addUpd">Publish</button></div></div>';
 h+='<h2>The 7 phases</h2>';
 S.ph.forEach(p=>{const D=dl.filter(d=>d.phase===p.id),dn=D.filter(d=>d.status==='done').length,st=D.length&&dn===D.length?'done':(D.some(d=>d.status!=='todo')?'doing':'todo');
  h+='<details class="card ph"><summary><div class="num">'+esc(p.num)+'</div><div class="nm">'+esc(p.title_en)+'</div><div class="dt">'+esc(fd(p.start))+' → '+esc(fd(p.end))+'</div>'+chip(st,st==='done'?'Complete':st==='doing'?'In progress':'Planned')+'</summary><div class="bar" style="margin:6px 0"><i style="width:'+avg(D)+'%"></i></div><ul>'+D.map(d=>'<li><span>'+esc(d.ref)+' · '+esc(d.title_en)+' <span class="mut small">· due '+esc(fd(d.due))+'</span></span>'+chip(d.status,ST[d.status]||d.status)+'</li>').join('')+'</ul></details>'});
 h+='<h2>Payments</h2><div class="card" style="overflow-x:auto"><table><tr><th>Milestone</th><th>Amount (SAR)</th><th>Planned</th><th>Status</th></tr>'+P.map(p=>'<tr><td>'+esc(p.title_en)+'</td><td>'+fmt(p.amount)+'</td><td>'+esc(fd(p.planned))+'</td><td>'+chip(p.status==='paid'?'paid':p.status==='sent'?'sent':'todo',PST[p.status]||p.status)+'</td></tr>').join('')+'</table></div>';
 return h}
function vQ(q){const lock=q.st==='validated'&&!isA();
 return '<div class="q" id="'+q.id+'"><div class="tx">'+esc(q.text)+'</div>'+(q.confirm&&!lock?'<div class="row" style="margin-bottom:6px"><button data-ok="'+q.id+'">✓ OK, correct</button><span class="small mut">or write the correction below</span></div>':'')+'<textarea data-q="'+q.id+'" '+(lock?'disabled':'')+' placeholder="Your answer…">'+esc(q.ans)+'</textarea><div class="meta">'+chip(q.st,QST[q.st]||q.st)+(q.ats?'<span>last saved '+esc(q.ats)+'</span>':'')+(isA()?'<span class="sp"></span><button data-pri="'+q.id+'">'+(isKey(q)?'Make later':'Make key')+'</button><button data-val="'+q.id+'">'+(q.st==='validated'?'Reopen':'Validate')+'</button><button data-del="'+q.id+'">✕</button>':'')+'</div>'+(isA()?'<textarea data-rep="'+q.id+'" placeholder="Your reply to the client (visible to them)…" style="margin-top:6px;min-height:44px">'+esc(q.rep||'')+'</textarea>':(q.rep?'<div class="rep"><b>NAYISSORIA:</b> '+esc(q.rep)+'</div>':''))+'</div>'}
function vTodo(){const Qs=IT('q').sort((a,b)=>a.ord-b.ord),K=Qs.filter(isKey),Lr=Qs.filter(q=>!isKey(q)),ko=K.filter(q=>q.st==='open').length,lo=Lr.filter(q=>q.st==='open').length,done=Qs.length-Qs.filter(q=>q.st==='open').length;
 const grp=L=>Object.keys(SEC).map(k=>{const X=L.filter(q=>q.sec===k);return X.length?'<h3 class="mut small" style="letter-spacing:2px;text-transform:uppercase;margin:14px 0 6px">'+esc(SEC[k][1])+'</h3>'+X.map(vQ).join(''):''}).join('');
 let h='<h1>To complete</h1><p class="sub">Answers save automatically and I see them as soon as you type. “To decide” is a valid answer.</p><div class="bar" style="margin-bottom:6px"><i style="width:'+pct(done,Qs.length)+'%"></i></div><p class="small mut">'+done+' of '+Qs.length+' answered</p>';
 h+='<h2>Key questions · to start Phase 1</h2><p class="small mut" style="margin-bottom:6px">'+(ko?ko+' left. These unlock the site visit and the first deliverables.':'All answered, thank you.')+'</p>'+grp(K);
 h+='<details'+(isA()?' open':'')+' style="margin-top:18px"><summary class="serif" style="font-size:19px;cursor:pointer;padding:6px 0;border-bottom:1px solid var(--ink)">Can follow in the next days <span class="mut small">('+lo+' to answer)</span></summary>'+grp(Lr)+'</details>';
 if(isA())h+='<div class="card" style="margin-top:14px"><div class="row"><select id="nqSec">'+Object.keys(SEC).map(k=>'<option value="'+k+'">'+esc(SEC[k][0])+'</option>').join('')+'</select><input type="text" id="nqTxt" placeholder="New question…" style="flex:1"><button class="g" data-act="addQ">Add</button></div></div>';
 return h}
function vCode(){const box=(t,title,hint)=>'<div class="card"><b>'+title+'</b><div class="small mut" style="margin:4px 0 8px">'+hint+'</div><div class="row"><input type="text" id="nc_'+t+'" placeholder="New code" autocomplete="off" style="flex:1;min-width:160px"><input type="text" id="nc2_'+t+'" placeholder="Repeat the new code" autocomplete="off" style="flex:1;min-width:160px"><button class="p" data-act="chg" data-t="'+t+'">Change</button></div></div>';
 let h='<h1>My access code</h1><p class="sub">'+(isA()?'Change your own code, or the client code.':'The code you received is provisional. Choose your own code: it replaces the old one immediately.')+'</p>';
 if(isA())h+=box('admin','Your administrator code','At least 6 letters or digits. Spaces, dashes and capitals are ignored. It must differ from the client code.')+box('client','Client code','At least 8 letters or digits. The client can also change it from their own “My code” tab. If they forget it, set a new one here.');
 else h+=box('client','Choose your own code','At least 8 letters or digits. Spaces, dashes and capitals are ignored. Keep it private: it gives access to your project space.');
 return h}
function vDocs(){const D=IT('doc');let h='<h1>Documents</h1><p class="sub">Contract, deliverables and files shared with you.</p>';
 h+=D.length?D.map(d=>'<div class="card row"><div class="sp"><b>'+esc(d.title)+'</b><div class="small mut">'+esc(d.note||'')+'</div></div><a class="btn" href="'+esc(d.url)+'" target="_blank" rel="noopener">Open ↗</a>'+(isA()?'<button data-del="'+d.id+'">✕</button>':'')+'</div>').join(''):'<p class="mut">No document yet.</p>';
 if(isA())h+='<div class="card"><div class="row"><input type="text" id="ndT" placeholder="Title" style="flex:1"><input type="url" id="ndU" placeholder="https://…" style="flex:2"><input type="text" id="ndN" placeholder="Note" style="flex:1"><button class="g" data-act="addDoc">Add</button></div></div>';
 return h}
function vMsg(){const M=IT('msg').sort((a,b)=>(a.ts||'')>(b.ts||'')?1:-1);let h='<h1>Questions & messages</h1><p class="sub">Ask me anything about the project, at any time. I answer here.</p>';
 h+=M.length?M.map(m=>'<div class="msg '+(m.from==='admin'?'admin':'client')+'"><small>'+(m.from==='admin'?'NAYISSORIA':'Client')+' · '+esc(m.ts)+(isA()?' · <a href="#" data-del="'+m.id+'">delete</a>':'')+'</small>'+esc(m.text)+'</div>').join(''):'<p class="mut">No message yet.</p>';
 h+='<div class="card" style="margin-top:12px"><textarea id="newMsg" placeholder="'+(isA()?'Reply to the client…':'Write your question…')+'"></textarea><div class="row" style="margin-top:8px"><span class="sp"></span><button class="p" data-act="send">Send</button></div></div>';return h}
function vGantt(){const ph=S.ph.slice(),dl=S.dl,P=S.pay;
 if(!ph.length)return '<h1>Timeline</h1><p class="sub">No phase yet.</p>';
 const D0=x=>new Date(x+'T00:00:00').getTime(),DAY=864e5;
 const st=Math.min(...ph.map(p=>D0(p.start))),en=Math.max(...ph.map(p=>D0(p.end))),span=Math.round((en-st)/DAY)+1,u=100/span;
 const pos=d=>Math.max(0,Math.min(100-u,((D0(d)-st)/DAY)*u));
 const wk=[];for(let t=st;t<=en;t+=7*DAY)wk.push(t);
 const lines=wk.map(t=>'<i class="gl" style="left:'+(((t-st)/DAY)*u)+'%"></i>').join('');
 const td=today(),tl=(D0(td)>=st&&D0(td)<=en)?'<i class="gtd" title="Today" style="left:'+pos(td)+'%"></i>':'';
 let h='<h1>Timeline</h1><p class="sub">Phases, deliverables and payments, week by week. The red line is today.</p><div class="card gt"><div class="in">';
 h+='<div class="gr"><div class="lab"></div><div class="track gh">'+wk.map(t=>'<span style="left:'+(((t-st)/DAY)*u)+'%">'+new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</span>').join('')+'</div></div>';
 ph.forEach(p=>{const D=dl.filter(d=>d.phase===p.id),l=pos(p.start),w=Math.max(u,pos(p.end)+u-l);
  h+='<div class="gr"><div class="lab"><b>'+esc(p.num)+'</b> '+esc(p.title_en)+'<div class="small mut">'+avg(D)+'%</div></div><div class="track">'+lines+'<i class="gb" style="left:'+l+'%;width:'+w+'%"><i style="width:'+avg(D)+'%"></i></i>'+D.map(d=>'<i class="dot '+d.status+'" title="'+esc(d.ref+' · '+d.title_en+' · due '+fd(d.due))+'" style="left:'+(pos(d.due)+u/2)+'%"></i>').join('')+tl+'</div></div>'});
 h+='<div class="gr"><div class="lab"><b>◆</b> Payments</div><div class="track">'+lines+P.map(p=>'<i class="dia'+(p.status==='paid'?' paid':'')+'" title="'+esc(p.title_en+' · '+fmt(p.amount)+' SAR · '+fd(p.planned))+'" style="left:'+(pos(p.planned)+u/2)+'%"></i>').join('')+tl+'</div></div>';
 h+='<div class="gr"><div class="lab"><b>★</b> Target opening</div><div class="track">'+lines+'<i class="star" title="Target opening" style="left:'+(100-u/2)+'%">★</i>'+tl+'</div></div>';
 h+='</div><div class="small mut" style="margin-top:10px">○ planned · <span style="color:var(--amb)">○</span> in progress · <span style="color:var(--grn)">●</span> validated · ◆ payment · bar fill = progress</div></div>';
 return h}
function render(){const a=$('#app');document.body.classList.toggle('lg',!S);const LHEX='<svg width="72" height="72" viewBox="0 0 58 58"><g fill="none" stroke="#e8962e" stroke-width="2.4" stroke-linejoin="round"><polygon points="20,20 28.66,25 28.66,35 20,40 11.34,35 11.34,25"/><polygon points="37.32,20 45.98,25 45.98,35 37.32,40 28.66,35 28.66,25"/><polygon points="28.66,35 37.32,40 37.32,50 28.66,55 20,50 20,40"/></g></svg>';if(!S){a.innerHTML='<div class="login"><div class="logo">'+LHEX+'</div><h1>Project space</h1><p class="sub">DOAN · Khaliat Al Nahl · خلية النحل</p><input type="text" id="code" placeholder="ACCESS CODE" autocomplete="off" autocapitalize="characters"><div class="err" id="err"></div><button class="p" id="go" style="width:100%">Enter</button><footer>NAYISSORIA ADVISORY</footer></div>';const go=async()=>{CODE=$('#code').value.trim();$('#err').textContent='';try{await load();localStorage.setItem('ncc',CODE);render()}catch(e){S=null;$('#err').textContent=/Too many/.test(e.message)?e.message:'Incorrect code.'}};$('#go').onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go()};return}
 const wq=waitQ().length;const HEX='<svg width="46" height="46" viewBox="0 0 58 58"><g fill="none" stroke="#e8962e" stroke-width="2.4" stroke-linejoin="round"><polygon points="20,20 28.66,25 28.66,35 20,40 11.34,35 11.34,25"/><polygon points="37.32,20 45.98,25 45.98,35 37.32,40 28.66,35 28.66,25"/><polygon points="28.66,35 37.32,40 37.32,50 28.66,55 20,50 20,40"/></g></svg>';const T=[['project','My project'],['gantt','Timeline'],['todo','To complete'+(wq?'<span class="bd">'+wq+'</span>':'')],['docs','Documents'],['msgs','Questions'],['code','My code']];
 const keep=document.activeElement&&document.activeElement.dataset&&(document.activeElement.dataset.q||document.activeElement.dataset.rep);
 a.innerHTML='<header><div class="logo">'+HEX+'</div><div class="t"><b>DOAN <span class="ar" dir="rtl">خلية النحل</span></b><small>KHALIAT AL NAHL · PROJECT SPACE · NAYISSORIA ADVISORY</small></div><div class="who">'+(S.role==='admin'?(inPV()?'Client view (preview)':'Consultant view')+'<button id="pvt">'+(inPV()?'Back to consultant view':'View as client')+'</button>':'Client view')+'<button id="out">Log out</button></div></header><nav>'+T.map(t=>'<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</nav>'+(inPV()?'<div class="pvb">You are seeing exactly what the client sees. Read-only, refreshed every 20 seconds.</div>':'')+'<main>'+({project:vProject,gantt:vGantt,todo:vTodo,docs:vDocs,msgs:vMsg,code:vCode}[TAB])()+'</main><footer>NAYISSORIA ADVISORY · CONFIDENTIAL</footer>';
 $('#out').onclick=()=>{localStorage.removeItem('ncc');try{sessionStorage.removeItem('npv')}catch(e){}PV=false;S=null;CODE='';render()};const pt=$('#pvt');if(pt)pt.onclick=()=>{PV=!PV;try{sessionStorage.setItem('npv',PV?'1':'')}catch(e){}if(TAB==='code')TAB='project';render()}}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-ok],[data-val],[data-pri],[data-del],[data-act]');if(!t||!S)return;
 if(t.dataset.tab){e.preventDefault();TAB=t.dataset.tab;render();return}
 try{
 if(t.dataset.ok){const q=IT('q').find(x=>x.id===t.dataset.ok);q.ans='OK ✓';q.st='answered';await put(q);await load(true);render();toast('Saved ✓')}
 else if(t.dataset.pri){const q=IT('q').find(x=>x.id===t.dataset.pri);q.pri=isKey(q)?'':'key';await put(q);render()}
 else if(t.dataset.val){const q=IT('q').find(x=>x.id===t.dataset.val);q.st=q.st==='validated'?(q.ans?'answered':'open'):'validated';await put(q);render()}
 else if(t.dataset.del){e.preventDefault();if(!confirm('Delete?'))return;await rpc('nay_cli_del',{p_code:CODE,p_id:t.dataset.del});S.items=S.items.filter(x=>x.id!==t.dataset.del);render()}
 else if(t.dataset.act==='addQ'){const x=$('#nqTxt').value.trim();if(!x)return;const n=IT('q').length;await put({id:uid('q'),kind:'q',sec:$('#nqSec').value,text:x,confirm:false,ans:'',st:'open',ord:n+1000});render()}
 else if(t.dataset.act==='addUpd'){const x=$('#newUpd').value.trim();if(!x)return;await put({id:uid('u'),kind:'upd',date:today(),text:x});render()}
 else if(t.dataset.act==='addDoc'){const ti=$('#ndT').value.trim(),u=$('#ndU').value.trim();if(!ti||!/^https?:\/\//.test(u))return toast('Title and a valid link are needed',2500);await put({id:uid('d'),kind:'doc',title:ti,url:u,note:$('#ndN').value.trim()});render()}
 else if(t.dataset.act==='chg'){const tg=t.dataset.t,a=$('#nc_'+tg).value.trim(),b=$('#nc2_'+tg).value.trim();if(!a)return;if(a.replace(/[^A-Za-z0-9]/g,'').toUpperCase()!==b.replace(/[^A-Za-z0-9]/g,'').toUpperCase())return toast('The two codes are not the same',3000);await rpc('nay_cli_setcode',{p_code:CODE,p_target:tg,p_new:a});if((isA()&&tg==='admin')||(!isA()&&tg==='client')){CODE=a;localStorage.setItem('ncc',CODE)}$('#nc_'+tg).value='';$('#nc2_'+tg).value='';toast('Code changed ✓',3000)}
 else if(t.dataset.act==='send'){const x=$('#newMsg').value.trim();if(!x)return;const id=uid('m');await put({id:id,kind:'msg',from:isA()?'admin':'client',text:x,ts:new Date().toLocaleString('sv-SE',{timeZone:'Asia/Riyadh'}).slice(0,16)});await load(true);render();toast('Sent ✓')}
 }catch(err){toast('Error: '+err.message,3500)}});
document.addEventListener('input',e=>{const el=e.target;if(!S)return;
 if(el.dataset.q){const q=IT('q').find(x=>x.id===el.dataset.q);q.ans=el.value;q.st=q.ans.trim()?(q.st==='validated'?'validated':'answered'):'open';save(q)}
 else if(el.dataset.sum){let o=IT('sum')[0];if(!o){o={id:'sum1',kind:'sum'};S.items.push(o)}o[el.dataset.sum]=el.value;save(o)}
 else if(el.dataset.rep){const q=IT('q').find(x=>x.id===el.dataset.rep);q.rep=el.value;save(q)}});
/* ---------- boot + live refresh ---------- */
(async()=>{CODE=localStorage.getItem('ncc')||'';if(CODE&&await load(true)){render()}else{S=null;render()}})();
setInterval(async()=>{if(!S||document.hidden)return;const ae=document.activeElement;if(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT'))return;if(await load(true))render()},20000);
</script></body></html>
